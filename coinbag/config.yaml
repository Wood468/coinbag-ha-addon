name: Coin Bag
version: "0.1.11"
slug: coinbag
description: Pairs with Pokémon GO as a Nintendo Switch and receives postcards automatically over Bluetooth.
url: https://github.com/na-ji/pokemon-go-coin-bag
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
host_network: true
host_dbus: true
apparmor: false
homeassistant_api: true
options:
  log_level: info
  adapter: auto
  notify_mode: auto
schema:
  log_level: list(debug|info|warning)
  adapter: str
  notify_mode: list(auto|start)
