name: Validate Coin Bag add-on

on:
  pull_request:
  push:
    branches:
      - main
      - "diagnostics/**"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml 'bleak==2.1.1'
      - name: Compile Python sources
        run: python -m compileall -q coinbag
      - name: Run static regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate service script syntax
        run: sh -n coinbag/run.sh
      - name: Validate add-on configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("coinbag/config.yaml").read_text())
          assert config["version"] == "0.1.15"
          assert config["options"]["notify_mode"] == "auto"
          assert config["schema"]["notify_mode"] == "list(auto|start)"
          assert "bleak==2.1.1" in Path("coinbag/Dockerfile").read_text()
          assert "bleak-esphome==3.9.1" in Path("coinbag/Dockerfile").read_text()
          assert config["options"]["transport"] == "bluez"
          assert config["schema"]["transport"] == "list(bluez|esphome)"
          assert "pairing_agent.py" in Path("coinbag/Dockerfile").read_text()
          print("Add-on configuration checks passed")
          PY
      - name: Build add-on container
        run: docker build --pull --tag coinbag-addon:test coinbag
