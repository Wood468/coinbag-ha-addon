name: Validate Coin Bag add-on

on:
  pull_request:
  push:
    branches:
      - main
      - "diagnostics/**"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml 'bleak==2.1.1'
      - name: Compile Python sources
        run: python -m compileall -q coinbag pogo-store-reader
      - name: Run static regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate service script syntax
        run: sh -n coinbag/run.sh
      - name: Validate add-on configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("coinbag/config.yaml").read_text())
          assert config["version"] == "0.1.14"
          assert config["options"]["notify_mode"] == "auto"
          assert config["schema"]["notify_mode"] == "list(auto|start)"
          assert "bleak==2.1.1" in Path("coinbag/Dockerfile").read_text()
          assert "pairing_agent.py" in Path("coinbag/Dockerfile").read_text()
          print("Add-on configuration checks passed")
          PY
      - name: Build add-on container
        run: docker build --pull --tag coinbag-addon:test coinbag

  reader-docker-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Store Reader image (includes build-time Chromium launch)
        run: docker build --pull --tag pogo-store-reader:ci pogo-store-reader
      - name: Verify Chromium launches inside the built Reader container
        run: |
          docker run --rm --entrypoint python3 pogo-store-reader:ci -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); page = b.new_page(); page.goto("data:text/html,<title>Reader CI</title>"); assert page.title() == "Reader CI"; b.close(); p.stop()'
